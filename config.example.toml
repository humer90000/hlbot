# paper. mainnet prices, fills stay local.
mode = "paper"
# bar size the strategies read. 1m 5m 15m 1h 4h 1d, the list is on the page
interval = "15m"
host = "127.0.0.1"
port = 8787
equity = 10000
arm_file = "ARM"
account = ""
vault = ""

[risk]
max_leverage = 1
max_order_frac = 0.10
max_coin_frac = 0.25
max_gross_frac = 1
max_daily_loss_frac = 0.03
max_slippage_bps = 8
min_liq_distance = 0.15
stale_ms = 1500
max_entry_deviation = 0.01
book_participation = 0.10
max_spread_bps = 8
min_day_volume_usd = 5000000


[project]
name = "hlbot"
version = "0.3.2"
description = "Local trading desk for Hyperliquid. Paper by default. The agent can trade and cannot withdraw."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "hyperliquid-python-sdk>=0.20",
]

[project.scripts]
hlbot = "hlbot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
hlbot = ["console.html"]

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Hyperliquid Tradebot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0f14;
    --panel: #141922;
    --panel-2: #1b212c;
    --line: #2c3544;
    --text: #e8edf5;
    --muted: #8e9aab;
    --brass: #e2b56a;
    --brass-ink: #1c1508;
    --bid: #8fd0a8;
    --ask: #e39286;
    --info: #8eb0dd;
    --danger: #e7a196;
    --shadow: 0 16px 50px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 "IBM Plex Sans", "Segoe UI", sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  .num { font-family: "IBM Plex Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }

  [hidden] { display: none !important; }
  #gate {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: grid;
    place-items: center;
    background:
      radial-gradient(900px 420px at 50% -10%, rgba(226,181,106,.14), transparent 60%),
      var(--bg);
  }
  .card {
    width: min(400px, calc(100% - 32px));
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 22px 18px;
    box-shadow: var(--shadow);
  }
  .brand { font-weight: 600; letter-spacing: .02em; }
  .sub { color: var(--muted); margin: 6px 0 16px; font-size: 13px; }
  .card input {
    width: 100%;
    background: #0e131b;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .card .row { display: flex; justify-content: flex-end; margin-top: 12px; }
  .err { color: var(--danger); min-height: 1.2em; margin-top: 8px; font-size: 13px; }

  .top {
    height: 56px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    background: #10141b;
  }
  .top .grow { flex: 1; }
  .stat { display: flex; flex-direction: column; line-height: 1.15; }
  .stat b { font-weight: 500; }
  .stat span { color: var(--muted); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
  .pos { color: var(--bid); }
  .neg { color: var(--ask); }
  .pill {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 9px;
    font-size: 12px;
    letter-spacing: .03em;
  }
  .pill.paper { color: var(--info); background: #162033; border-color: #314864; }
  .pill.live { color: #ffd0c8; background: #2a1614; border-color: #8a4034; }
  .pill.halted { color: var(--brass); background: #2a2416; border-color: #6d5a32; }
  .actions { display: flex; gap: 8px; }

  button.btn, .btn {
    background: #1c2430;
    border: 1px solid #3a4658;
    border-radius: 8px;
    padding: 6px 11px;
  }
  button.btn:hover { background: #243044; }
  button.primary { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); font-weight: 600; }
  button.primary:hover { filter: brightness(1.05); }
  button.danger { background: transparent; color: var(--danger); border-color: #8a4034; }
  button.quiet { background: transparent; }

  .desk {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 400px;
    height: calc(100vh - 56px);
  }
  #halt-banner:not([hidden]) + .desk { height: calc(100vh - 112px); }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .toolbar input[type="search"] {
    width: 220px;
    background: #0e131b;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg {
    display: flex;
    background: #0e131b;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 2px;
  }
  .seg button {
    border: 0;
    background: transparent;
    border-radius: 7px;
    padding: 5px 10px;
    color: var(--muted);
    font-size: 12px;
  }
  .seg button.on { background: #2a2418; color: #f3e2c4; }
  .chip {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 10px;
    color: var(--muted);
    font-size: 12px;
  }
  .chip.on { color: #f3e2c4; border-color: #8d7344; background: #2a2418; }
  .pager { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }

  .scroll { flex: 1; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 7px 10px; border-bottom: 1px solid #222a36; white-space: nowrap; }
  th {
    position: sticky; top: 0; z-index: 1;
    background: #121820;
    color: var(--muted);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .06em;
    text-transform: uppercase;
    text-align: left;
    cursor: pointer;
  }
  th.num, td.num { text-align: right; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #18202b; }
  tbody tr.sel { background: #243044; }
  tbody tr.on td.name { box-shadow: inset 2px 0 0 var(--brass); }
  td.name { font-weight: 500; }
  .tag { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .tag.dead { color: var(--ask); }
  td.up { color: var(--bid); }
  td.down { color: var(--ask); }
  .empty { padding: 48px 16px; color: var(--muted); text-align: center; }

  aside {
    border-left: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button {
    flex: 1;
    background: transparent;
    border: 0;
    border-bottom: 2px solid transparent;
    padding: 10px 8px;
    color: var(--muted);
  }
  .tabs button.on { color: var(--text); border-bottom-color: var(--brass); }
  .pane { flex: 1; overflow: auto; padding: 14px 16px 28px; }
  .pane h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 13px; }
  .kv span { color: var(--muted); }
  .split { height: 1px; background: var(--line); margin: 14px 0; }
  .banner {
    margin: 8px 16px 0;
    padding: 8px 10px;
    border: 1px solid #6d5a32;
    background: #2a2416;
    color: #f0e0c0;
    border-radius: 8px;
    font-size: 13px;
  }

  .field { margin: 0 0 10px; position: relative; }
  .field label { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .tip {
    display: none;
    position: absolute;
    left: 0;
    bottom: calc(100% - 2px);
    z-index: 4;
    width: min(280px, 100%);
    padding: 6px 8px;
    background: #10161f;
    border: 1px solid #3a4658;
    border-radius: 6px;
    color: #d5deea;
    font-size: 12px;
    line-height: 1.35;
    pointer-events: none;
    box-shadow: var(--shadow);
  }
  .field:hover > .tip, .field:focus-within > .tip { display: block; }
  .field input, .field textarea, .field select {
    width: 100%;
    background: #0e131b;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 9px;
  }
  .hint { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .hint.warn { color: var(--danger); }
  input[type="range"] { width: 100%; accent-color: var(--brass); }
  .group-title { margin: 14px 0 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .strat {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    background: var(--panel-2);
  }
  .strat header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .checks { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  textarea.json { min-height: 120px; font-family: "IBM Plex Mono", Consolas, monospace; font-size: 12px; }

  #tape { font-family: "IBM Plex Mono", Consolas, monospace; font-size: 12px; white-space: pre-wrap; color: #c5ceda; }

  #modal { position: fixed; inset: 0; background: rgba(6,8,12,.62); display: flex; align-items: center; justify-content: center; z-index: 5; }
  #modal[hidden] { display: none; }
  .sheet {
    width: min(440px, calc(100% - 32px));
    background: #171d27;
    border: 1px solid #3a4658;
    border-radius: 12px;
    padding: 18px;
    box-shadow: var(--shadow);
  }
  .sheet h2 { margin: 0 0 8px; font-size: 18px; }
  .sheet p { margin: 0; color: #c5ceda; }
  .sheet .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 6; }
  .toast {
    background: #1c2430;
    border: 1px solid #3a4658;
    border-radius: 8px;
    padding: 8px 12px;
    box-shadow: var(--shadow);
    max-width: 320px;
  }
  .toast.bad { border-color: #8a4034; color: #ffd0c8; }
  @media (max-width: 980px) {
    body { display: block; }
    .top { height: auto; flex-wrap: wrap; row-gap: 8px; padding: 8px 12px; }
    .top .brand { flex: 1 1 100%; }
    .top .grow { display: none; }
    .desk, #halt-banner:not([hidden]) + .desk { grid-template-columns: 1fr; height: auto; }
    .scroll { max-width: 100%; min-width: 0; }
    aside { border-left: 0; border-top: 1px solid var(--line); min-height: 420px; }
  }
</style>
</head>
<body>
<div id="gate">
  <form class="card" id="login-form">
    <div class="brand">Local Hyperliquid Tradebot</div>
    <div class="sub">token from the terminal. doesn't leave this machine.</div>
    <input id="token" type="password" autocomplete="off" placeholder="token" autofocus>
    <div class="row"><button class="btn primary" type="submit">Open</button></div>
    <div class="err" id="login-err"></div>
  </form>
</div>

<div id="desk" hidden>
  <header class="top">
    <div class="brand">Local Hyperliquid Tradebot</div>
    <span class="pill" id="mode">paper</span>
    <span class="pill" id="arm-pill">safe</span>
    <div class="stat"><span>equity</span><b class="num" id="eq">—</b></div>
    <div class="stat"><span>day</span><b class="num" id="pnl">—</b></div>
    <div class="stat"><span>mids</span><b class="num" id="mids">—</b></div>
    <div class="stat"><span>loop</span><b class="num" id="loop">—</b></div>
    <div class="grow"></div>
    <div class="actions">
      <button class="btn primary" id="arm" type="button">Arm</button>
      <button class="btn" id="halt" type="button">Halt</button>
      <button class="btn quiet" id="resume" type="button">Resume</button>
      <button class="btn danger" id="flatten" type="button">Flatten</button>
    </div>
  </header>
  <div id="halt-banner" class="banner" hidden>halted. exits still go.</div>
  <div class="desk">
    <main>
      <div class="toolbar">
        <input id="q" type="search" placeholder="Search coins  /" autocomplete="off">
        <div class="seg" id="markets"></div>
        <div class="chips" id="chips"></div>
        <div class="pager">
          <span id="range"></span>
          <button class="btn quiet" id="prev" type="button">Prev</button>
          <button class="btn quiet" id="next" type="button">Next</button>
        </div>
      </div>
      <div class="scroll" id="scroll">
        <table>
          <thead>
            <tr>
              <th data-sort="name">Market</th>
              <th class="num" data-sort="bid">Bid</th>
              <th class="num" data-sort="ask">Ask</th>
              <th class="num" data-sort="spread_bps">Spread</th>
              <th class="num" data-sort="funding">Funding</th>
              <th class="num" data-sort="day_ntl">Day vol</th>
              <th class="num" data-sort="position">Pos</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden>Nothing in this view.</div>
      </div>
    </main>
    <aside>
      <div class="tabs">
        <button type="button" data-tab="coin" class="on">Coin</button>
        <button type="button" data-tab="strategies">Strategies</button>
        <button type="button" data-tab="risk">Risk</button>
        <button type="button" data-tab="account">Account</button>
        <button type="button" data-tab="tape">Tape</button>
      </div>
      <div class="pane" id="pane-coin"></div>
      <div class="pane" id="pane-strategies" hidden></div>
      <div class="pane" id="pane-risk" hidden></div>
      <div class="pane" id="pane-account" hidden></div>
      <div class="pane" id="pane-tape" hidden><div id="tape"></div></div>
    </aside>
  </div>
</div>

<div id="modal" hidden>
  <div class="sheet">
    <h2 id="modal-title"></h2>
    <p id="modal-body"></p>
    <div class="row">
      <button class="btn quiet" id="modal-cancel" type="button">Cancel</button>
      <button class="btn primary" id="modal-ok" type="button">Confirm</button>
    </div>
  </div>
</div>
<div id="toasts"></div>

<script>
const $ = (id) => document.getElementById(id);
const PAGE = 40;
const MARKETS = [
  ["all", "All"],
  ["perp", "Perps"],
  ["spot", "Spot"],
  ["hip3", "HIP-3"],
];
const VIEWS = [
  ["all", "Any"],
  ["liquid", "Liquid"],
  ["on", "Enabled"],
  ["pos", "Positions"],
];
const TIPS = {
  max_order_frac: "one order, as a slice of equity. 0.10 is 10%. past 1 it needs the coin's leverage to allow it. leverage 1 pulls it back to equity.",
  max_coin_frac: "biggest one coin. it still can't beat the leverage.",
  max_gross_frac: "everything added up. 1 is about 1x equity. 3 is the ceiling.",
  max_daily_loss_frac: "day's down this much -> no new entries, and the guard flattens.",
  min_liq_distance: "cushion down to the liq price. closer than this and the entry is refused. 0.15 is the floor.",
  max_slippage_bps: "how far the IOC can reach past the mid. bps.",
  stale_ms: "quote older than this, skip the entry. exits still go.",
  max_entry_deviation: "limit isn't allowed to sit further off the mid.",
  book_participation: "don't eat more than this of the size on screen. paper size is a guess from day volume.",
  max_spread_bps: "wider than this counts as thin. force-on still works, size just gets cut.",
  min_day_volume_usd: "same idea for dead names.",
  coins: "blank = whatever you toggled in the table. or type names.",
  donchian: "lookback. close outside the prior bars.",
  atr_len: "window for the ATR the stop hangs off.",
  stop_atr: "stop in ATRs. reduce-only, sits on the exchange.",
  take_r: "target, multiple of the stop. blank means no target.",
  risk_frac: "what you lose if the stop fills. it won't take more than 2%.",
  max_hold_bars: "kick it after this many bars. the size is whatever the dropdown says.",
  funding_block: "hourly. longs pay when it's positive. past this, that side is skipped.",
  fast: "short ema. has to be smaller than the slow one.",
  slow: "long ema.",
  signal: "macd signal. the cross is the trigger.",
  rsi_len: "14 is the usual.",
  rsi_buy: "buy under this.",
  rsi_sell: "sell over this.",
  length: "bollinger lookback.",
  mult: "band width in stdevs. 2 is the boring default.",
  account: "0x and 40 hex. the master private key does not come here.",
  vault: "only if the agent trades a vault. else leave it.",
  agent_key: "api agent from HL. signs, can't withdraw. sits in memory till you restart.",
  mode: "paper is a local wallet. testnet/live talk to that network. live also wants a file named ARM in the project dir or Arm won't stick.",
};
const RISK_GROUPS = [
  ["Size", [
    ["max_order_frac", "Order size"],
    ["max_coin_frac", "Per coin"],
    ["max_gross_frac", "Gross"],
  ]],
  ["Loss", [
    ["max_daily_loss_frac", "Daily loss"],
    ["min_liq_distance", "Liq distance"],
  ]],
  ["Fills", [
    ["max_slippage_bps", "Slippage, bps"],
    ["stale_ms", "Stale quote, ms"],
    ["max_entry_deviation", "Off the mid"],
    ["book_participation", "Book share"],
  ]],
  ["Liquid", [
    ["max_spread_bps", "Max spread, bps"],
    ["min_day_volume_usd", "Min day volume"],
  ]],
];
const FLOORS = new Set(["min_liq_distance", "min_day_volume_usd"]);

let token = sessionStorage.getItem("hlbot") || "";
let state = null;
let coins = [];
let prevBid = {};
let market = "all";
let filter = "all";
let sortKey = "day_ntl";
let sortDir = -1;
let page = 0;
let selected = null;
let levHold = "";
let tab = "coin";
let riskDirty = false;
let modalResolve = null;

function headers() {
  return { "Authorization": "Bearer " + token, "Content-Type": "application/json" };
}
async function api(path, opt) {
  const res = await fetch(path, Object.assign({ headers: headers() }, opt || {}));
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || ("HTTP " + res.status));
  return body;
}
function toast(text, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = text;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3400);
}
function ask(title, body, okLabel) {
  if (modalResolve) {
    const prev = modalResolve;
    modalResolve = null;
    prev(false);
  }
  $("modal-title").textContent = title;
  $("modal-body").textContent = body;
  $("modal-ok").textContent = okLabel || "Confirm";
  $("modal").hidden = false;
  return new Promise((resolve) => { modalResolve = resolve; });
}
function closeModal(v) {
  $("modal").hidden = true;
  if (modalResolve) modalResolve(v);
  modalResolve = null;
}
function usd(n) {
  if (n == null || !isFinite(Number(n))) return "—";
  const v = Number(n);
  const a = Math.abs(v);
  const sign = v < 0 ? "-" : "";
  if (a >= 1e9) return sign + "$" + (a / 1e9).toFixed(2) + "B";
  if (a >= 1e6) return sign + "$" + (a / 1e6).toFixed(1) + "M";
  if (a >= 1e3) return sign + "$" + (a / 1e3).toFixed(1) + "k";
  return sign + "$" + a.toFixed(0);
}
function px(n) {
  if (n == null || !isFinite(Number(n))) return "—";
  const v = Number(n);
  const sign = v < 0 ? "-" : "";
  const a = Math.abs(v);
  if (a >= 1000) return sign + a.toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  if (a >= 1) return sign + a.toLocaleString("en-US", { maximumFractionDigits: 4 });
  if (a === 0) return "0";
  if (a >= 0.0001) return sign + a.toPrecision(4);
  return sign + a.toFixed(10).replace(/0+$/, "");
}
function money(n) {
  const v = Number(n);
  const cls = v < 0 ? "neg" : v > 0 ? "pos" : "";
  const text = (v > 0 ? "+" : "") + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return { cls, text };
}
function age(ms) {
  if (ms == null) return "no quote";
  if (ms < 1500) return "live";
  if (ms < 60000) return Math.round(ms / 1000) + "s old";
  return Math.round(ms / 60000) + "m old";
}
function passes(c) {
  if (market === "perp" && !(c.market === "perp" && !c.hip3)) return false;
  if (market === "spot" && c.market !== "spot") return false;
  if (market === "hip3" && !c.hip3) return false;
  if (filter === "liquid" && !c.liquid) return false;
  if (filter === "on" && !c.enabled) return false;
  if (filter === "pos" && !(Math.abs(c.position) > 0)) return false;
  return true;
}
function inMarket(c) {
  if (market === "perp") return c.market === "perp" && !c.hip3;
  if (market === "spot") return c.market === "spot";
  if (market === "hip3") return !!c.hip3;
  return true;
}
function view() {
  const q = $("q").value.trim().toLowerCase();
  let rows = coins.filter((c) => passes(c) && (!q || c.name.toLowerCase().includes(q) || (c.label || "").toLowerCase().includes(q)));
  rows.sort((a, b) => {
    const av = a[sortKey];
    const bv = b[sortKey];
    if (av == null && bv == null) return a.name.localeCompare(b.name);
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === "string") return av.localeCompare(bv) * sortDir;
    return (av - bv) * sortDir;
  });
  return rows;
}

function paintChrome() {
  const mode = state.mode || "paper";
  const pill = $("mode");
  pill.textContent = mode;
  pill.className = "pill " + (mode === "live" ? "live" : "paper");
  const arm = $("arm-pill");
  if (state.halted) { arm.textContent = "halted"; arm.className = "pill halted"; }
  else if (state.armed) { arm.textContent = "armed"; arm.className = "pill live"; }
  else { arm.textContent = "safe"; arm.className = "pill paper"; }
  $("eq").textContent = Number(state.equity).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const pnl = money(state.day_pnl || 0);

function tapeLine(line) {
  const sp = line.indexOf(" ");
  const ms = Number(line.slice(0, sp));
  if (sp < 1 || !Number.isFinite(ms) || ms < 1e12) return line;
  const d = new Date(ms);
  const p = (n) => String(n).padStart(2, "0");
  return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds()) + "  " + line.slice(sp + 1);
}

function paintTable() {
  const rows = view();
  const pages = Math.max(1, Math.ceil(rows.length / PAGE));
  if (page >= pages) page = pages - 1;
  const slice = rows.slice(page * PAGE, page * PAGE + PAGE);
  $("range").textContent = rows.length ? ((page * PAGE + 1) + "–" + (page * PAGE + slice.length) + " of " + rows.length) : "0";
  $("prev").disabled = page === 0;
  $("next").disabled = page >= pages - 1;
  $("empty").hidden = rows.length > 0;
  const body = $("rows");
  const existing = [...body.querySelectorAll("tr")];
  const same = existing.length === slice.length && existing.every((tr, i) => tr.dataset.name === slice[i].name);
  if (!same) {
    body.innerHTML = "";
    slice.forEach((c) => body.appendChild(buildRow(c)));
  } else {
    slice.forEach((c, i) => fillRow(existing[i], c));
  }
  document.querySelectorAll("th[data-sort]").forEach((th) => {
    const mark = th.dataset.sort === sortKey ? (sortDir < 0 ? " ↓" : " ↑") : "";

}

function readControl(el) {
  const k = el.dataset.key;
  if (el.type === "checkbox") return el.checked;
  if (k === "coins") return el.value.split(",").map((x) => x.trim()).filter(Boolean);
  if (el.type === "number") {
    if (el.value.trim() === "") return null;
    const n = Number(el.value);
    return Number.isFinite(n) ? n : null;
  }
  if (k === "name" || k === "kind") return el.value.trim();
  return el.value;
}

function field(key, label, value, step, tip) {

  input.type = numeric ? "number" : "text";
  if (step) input.step = step;
  input.value = value == null ? "" : value;
  wrap.appendChild(lab);
  wrap.appendChild(input);
  if (tip) {
    const bubble = document.createElement("div");
    bubble.className = "tip";
    bubble.textContent = tip;

function deskMargin(c) {
  if (!c || c.market !== "perp" || !(Number(c.max_leverage) > 1)) return "1x";
  const top = Math.floor(Number(c.max_leverage) || 1);
  let n = Math.floor(Number(c.leverage) || 1);
  if (n < 1) n = 1;
  if (n > top) n = top;
  const iso = (state && state.margin) === "isolated" || c.isolated_only;
  if (n <= 1) return iso ? "1x isolated" : "1x";
  return n + "x " + (iso ? "isolated" : "cross");
}
function leverageHint(n, top) {
  if (n >= top && top > 1) return "this is the highest the exchange allows on this coin. the liquidation sits close to the price, and a small move can wipe the margin.";
  if (n <= 1) return "1x keeps the size inside equity. this coin's exchange max is " + top + "x.";
  return "the exchange is set to " + n + "x before an entry. this coin goes up to " + top + "x.";
}
function leverageBox(c) {
  const top = Math.max(1, Math.floor(Number(c.max_leverage) || 1));
  let n = Math.floor(Number(c.leverage) || 1);
  if (n < 1) n = 1;
  if (n > top) n = top;
  const wrap = document.createElement("div");
  wrap.className = "field";
  wrap.dataset.lev = c.name;
  const lab = document.createElement("label");
  const name = document.createElement("span");
  name.textContent = "Leverage";
  const val = document.createElement("b");
  val.className = "num";
  val.textContent = n + "x";
  lab.appendChild(name);
  lab.appendChild(val);
  const slider = document.createElement("input");
  slider.type = "range";
  slider.min = "1";
  slider.max = String(top);
  slider.step = "1";
  slider.value = String(n);
  slider.dataset.role = "lev";
  slider.dataset.coin = c.name;
  const hint = document.createElement("div");
  hint.className = n >= top ? "hint warn" : "hint";
  hint.textContent = leverageHint(n, top);
  const paint = () => {
    const now = Math.max(1, Math.min(top, Math.floor(Number(slider.value) || 1)));
    val.textContent = now + "x";
    hint.className = now >= top ? "hint warn" : "hint";
    hint.textContent = leverageHint(now, top);
  };
  slider.oninput = () => { levHold = c.name; paint(); };
  slider.onchange = async () => {
    const now = Math.max(1, Math.min(top, Math.floor(Number(slider.value) || 1)));
    try {
      const r = await api("/api/leverage", { method: "POST", body: JSON.stringify({ coin: c.name, leverage: now }) });
      const row = coins.find((x) => x.name === c.name);
      if (row) row.leverage = r.leverage;
      paint();
    } catch (err) {
      toast(err.message, "bad");
    }
    levHold = "";
  };
  wrap.appendChild(lab);
  wrap.appendChild(slider);
  wrap.appendChild(hint);
  return wrap;
}
function paintRisk() {
  const root = $("pane-risk");
  if (riskDirty && root.contains(document.activeElement)) return;
  root.innerHTML = "";
  const caps = (state && state.ceilings) || {};
  const cur = (state && state.risk) || {};
  const note = document.createElement("div");
  note.className = "meta";
  note.textContent = "you can only tighten what's baked in. looser numbers get bounced and the old limits stay.";
  root.appendChild(note);
  const modeRow = document.createElement("div");
  modeRow.className = "field";
  const modeLab = document.createElement("label");
  modeLab.textContent = "Margin";
  const modeBtns = document.createElement("div");
  modeBtns.className = "actions";
  [["cross", "Cross"], ["isolated", "Isolated"]].forEach(([id, label]) => {
    const b = document.createElement("button");
    b.type = "button";
    const on = ((state && state.margin) || "cross") === id;
    b.className = on ? "btn primary" : "btn";
    b.textContent = label;
    b.onclick = async () => {
      try {
        const r = await api("/api/margin", { method: "POST", body: JSON.stringify({ margin: id }) });
        if (state) state.margin = r.margin;
        toast(r.margin === "isolated" ? "isolated margin" : "cross margin");
        modeBtns.querySelectorAll("button").forEach((x) => {
          x.className = x.textContent.toLowerCase() === r.margin ? "btn primary" : "btn";
        });
      } catch (err) { toast(err.message, "bad"); }
    };
    modeBtns.appendChild(b);
  });
  const modeHint = document.createElement("div");
  modeHint.className = "hint";
  modeHint.textContent = "cross shares the account. isolated locks the margin on that coin, so a liquidation stays there. a name that is isolated-only stays isolated.";
  modeRow.appendChild(modeLab);
  modeRow.appendChild(modeBtns);
  modeRow.appendChild(modeHint);
  root.appendChild(modeRow);
  RISK_GROUPS.forEach(([title, rows]) => {
    const h = document.createElement("div");
    h.className = "group-title";
    h.textContent = title;
    root.appendChild(h);
    rows.forEach(([key, label]) => {
      const wrap = document.createElement("div");
      wrap.className = "field";
      const lab = document.createElement("label");
      lab.textContent = label;
      const input = document.createElement("input");
      input.name = key;
      input.type = "number";
      input.step = "any";
      input.value = cur[key] == null ? "" : cur[key];
      input.oninput = () => { riskDirty = true; caption.textContent = describe(key, input.value, caps[key]); };
      const caption = document.createElement("div");
      caption.className = "hint";
      caption.textContent = describe(key, cur[key], caps[key]);
      wrap.appendChild(lab);
      wrap.appendChild(input);
      wrap.appendChild(caption);
      if (TIPS[key]) {
        const bubble = document.createElement("div");
        bubble.className = "tip";
        bubble.textContent = TIPS[key];
        wrap.appendChild(bubble);
      }
      root.appendChild(wrap);
    });
  });
  const save = document.createElement("button");
  save.type = "button";
  save.className = "btn primary";
  save.textContent = "Save limits";
  save.onclick = saveRisk;
  root.appendChild(save);
  const extra = document.createElement("div");
  extra.className = "actions";
  extra.style.marginTop = "12px";
  const reload = document.createElement("button");
  reload.type = "button";
  reload.className = "btn quiet";
  reload.textContent = "Reload markets";
  reload.onclick = async () => {
    try { const r = await api("/api/catalog/reload", { method: "POST" }); toast("markets " + r.coins); tick(); }
    catch (err) { toast(err.message, "bad"); }
  };
  const liq = document.createElement("button");
  liq.type = "button";
  liq.className = "btn";
  liq.textContent = "Enable liquid";
  liq.onclick = enableLiquid;
  extra.appendChild(liq);
  extra.appendChild(reload);
  root.appendChild(extra);
}
function describe(key, value, cap) {
  const n = Number(value);
  let shown = "";
  if (isFinite(n)) {
    if (key.endsWith("_frac") || key === "min_liq_distance" || key === "max_entry_deviation" || key === "book_participation") shown = (n * 100).toFixed(2) + "%";
    else if (key === "min_day_volume_usd") shown = usd(n);
    else shown = String(n);
  }
  if (cap == null) return shown;
  const edge = FLOORS.has(key) ? "floor " + cap : "ceiling " + cap;
  return shown ? shown + " · " + edge : edge;
}
async function saveRisk() {
  const body = {};
  $("pane-risk").querySelectorAll("input[name]").forEach((el) => {
    const raw = el.value.trim();
    body[el.name] = raw === "" ? null : Number(raw);
  });
  try {
    await api("/api/risk", { method: "POST", body: JSON.stringify(body) });
    riskDirty = false;
    toast("limits saved");
    await tick();
    paintRisk();
  } catch (err) {
    toast(err.message, "bad");
    riskDirty = false;
    paintRisk();
  }
}

async function toggleCoin(c) {
  try {
    let force = false;
    if (!c.enabled && c.delisted) { toast(c.name + " is delisted", "bad"); return; }
    if (!c.enabled && !c.liquid) {
      const midOnly = c.spread_bps == null && c.bid != null;
      const body = midOnly
        ? "only a mid so far. nothing opens until a real bid and ask show up."
        : "thin book. size gets cut harder. the account caps don't move.";
      force = await ask(c.label || c.name, body, "Enable anyway");
      if (!force) return;
    }
    await api("/api/coins/enable", { method: "POST", body: JSON.stringify({ name: c.name, on: !c.enabled, force }) });
    toast((c.enabled ? "off " : "on ") + (c.label || c.name));
    await tick();
  } catch (err) { toast(err.message, "bad"); }
}
async function enableLiquid() {
  const n = coins.filter((c) => c.liquid && !c.enabled).length;
  const ok = await ask("Enable liquid markets", n + " names clear the spread / volume cut. thin ones stay off.", "Enable " + n);
  if (!ok) return;
  try {
    const r = await api("/api/coins/enable-liquid", { method: "POST" });
    toast("enabled " + r.added);
    tick();
  } catch (err) { toast(err.message, "bad"); }
}

function paintAccount() {
  const root = $("pane-account");
  if (root.contains(document.activeElement)) return;
  const link = (state && state.link) || {};
  root.innerHTML = "";
  const note = document.createElement("div");
  note.className = "meta";
  if (link.key_loaded) {
    note.textContent = "agent " + (link.agent || "") + " on " + (link.address || "") + (link.arm_file ? ". ARM file is there." : ". live still needs a file named ARM or orders won't leave.");
  } else {
    note.textContent = "paper fills stay on this box. testnet and live read the account. master key stays offline.";
  }
  root.appendChild(note);
  const pockets = (state && state.pockets) || {};
  if (pockets.perp_free != null || pockets.spot_usdc != null) {
    const line = document.createElement("div");
    line.className = "meta";
    const bits = [];
    if (pockets.perp_free != null) bits.push("perp free " + usd(pockets.perp_free));
    if (pockets.spot_usdc != null) bits.push("spot usdc " + usd(pockets.spot_usdc));
    line.textContent = bits.join(" · ") + ". perp entries leave the liq cushion untouched. spot buys spend the spot usdc.";
    root.appendChild(line);
  }
  const modeWrap = document.createElement("div");
  modeWrap.className = "field";
  const modeLab = document.createElement("label");
  modeLab.textContent = "Mode";
  const mode = document.createElement("select");
  mode.dataset.key = "mode";
  [["paper", "Paper"], ["testnet", "Testnet"], ["live", "Live"]].forEach(([id, label]) => {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = label;
    mode.appendChild(opt);
  });
  mode.value = (state && state.mode) || "paper";
  modeWrap.appendChild(modeLab);
  modeWrap.appendChild(mode);
  const modeTip = document.createElement("div");
  modeTip.className = "tip";
  modeTip.textContent = TIPS.mode;
  modeWrap.appendChild(modeTip);
  root.appendChild(modeWrap);
  root.appendChild(field("account", "Account address", link.address || "", "", TIPS.account));
  root.appendChild(field("vault", "Vault address, optional", link.vault || "", "", TIPS.vault));
  const secret = field("agent_key", "Agent key", "", "", TIPS.agent_key);
  secret.querySelector("input").type = "password";
  secret.querySelector("input").autocomplete = "off";
  root.appendChild(secret);
  const go = document.createElement("button");
  go.type = "button";
  go.className = "btn primary";
  go.textContent = "Connect";
  go.onclick = () => connectAccount(root);
  root.appendChild(go);
}

async function connectAccount(root) {
  const body = { mode: "paper", account: "", vault: "", agent_key: "" };
  root.querySelectorAll("[data-key]").forEach((el) => { body[el.dataset.key] = el.value.trim(); });
  if (body.mode === "paper") {
    const ok = await ask(
      "Paper",
      "clears the local wallet. equity goes back to the start, and a live link drops.",
      "Reset"
    );
    if (!ok) return;
  } else {
    const ok = await ask(
      "Connect " + body.mode,
      "key stays in this process. live still waits for Arm, and for an ARM file.",
      "Connect"
    );
    if (!ok) return;
  }
  try {
    const res = await api("/api/account", { method: "POST", body: JSON.stringify(body) });
    toast(res.mode === "paper" ? "paper wallet" : ("connected " + res.mode));
    await tick();
    paintAccount();
  } catch (err) {
    const say = {
      account: "address needs 0x and 40 hex characters.",
      vault: "vault address looks wrong.",
      "agent key": "agent key was rejected.",
    };
    toast(say[err.message] || err.message, "bad");
  }
}

async function tick() {
  try {
    state = await api("/api/state");
    coins = await api("/api/coins");
    $("gate").hidden = true;
    $("desk").hidden = false;
    paintChrome();
    paintChips();
    paintTable();
    if (tab === "coin") paintCoin();
  } catch (err) {
    if (String(err.message).includes("unauthorized") || String(err.message).includes("401")) {
      $("desk").hidden = true;
      $("gate").hidden = false;
      $("login-err").textContent = "bad token.";
      return;
    }
    toast(err.message, "bad");
  }
}

$("login-form").onsubmit = async (ev) => {
  ev.preventDefault();
  token = $("token").value.trim();
  sessionStorage.setItem("hlbot", token);
  $("login-err").textContent = "";
  await tick();
};
$("modal-cancel").onclick = () => closeModal(false);
$("modal-ok").onclick = () => closeModal(true);
$("modal").onclick = (ev) => { if (ev.target === $("modal")) closeModal(false); };
$("prev").onclick = () => { page = Math.max(0, page - 1); paintTable(); $("scroll").scrollTop = 0; };
$("next").onclick = () => { page += 1; paintTable(); $("scroll").scrollTop = 0; };
$("q").oninput = () => { page = 0; paintTable(); };
document.querySelectorAll("th[data-sort]").forEach((th) => {
  th.onclick = () => {
    const key = th.dataset.sort;
    if (sortKey === key) sortDir *= -1;
    else { sortKey = key; sortDir = key === "name" ? 1 : -1; }
    page = 0;
    paintTable();
  };
});
document.querySelectorAll(".tabs button").forEach((b) => { b.onclick = () => showTab(b.dataset.tab); });
$("arm").onclick = async () => {
  if (state && state.armed) {
    if (!await ask("Disarm", "new entries stop. open stuff stays until you flatten or a stop fills.", "Disarm")) return;
    try { await api("/api/disarm", { method: "POST" }); toast("disarmed"); tick(); }
    catch (err) { toast(err.message, "bad"); }
    return;
  }
  const mode = state ? state.mode : "paper";
  const body = mode === "live"
    ? "live orders get signed and sent. the agent still can't withdraw."
    : "enabled coins can open. paper fills stay in the local wallet.";
  if (!await ask("Arm " + mode, body, "Arm")) return;
  try { await api("/api/arm", { method: "POST" }); toast("armed"); tick(); }
  catch (err) { toast(err.message, "bad"); }
};
$("halt").onclick = async () => {
  await api("/api/halt", { method: "POST" });
  toast("halted");
  tick();
};
$("resume").onclick = async () => {
  await api("/api/resume", { method: "POST" });
  toast("resumed");
  tick();
};
$("flatten").onclick = async () => {
  if (!await ask("Flatten", "close what's open. reduce-only.", "Flatten")) return;
  try {
    const res = await api("/api/flatten", { method: "POST" });
    toast(res.n ? "flatten sent" : "nothing open");
    tick();
  }
  catch (err) { toast(err.message, "bad"); }
};
document.addEventListener("keydown", (ev) => {
  if (!$("modal").hidden) {
    if (ev.key === "Escape") closeModal(false);
    return;
  }
  if (ev.key === "/" && document.activeElement && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
    ev.preventDefault();
    $("q").focus();
  }
});

if (token) tick();
// screen only. the loop that can send orders is the python clock
setInterval(() => { if (token && !$("desk").hidden) tick(); }, 1000);
</script>
</body>
